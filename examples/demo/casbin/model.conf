# Casbin model — RBAC over tables/columns, plus role hierarchy.
#
# Objects are "table.column" strings. keyMatch lets a policy grant
# "inventory.*" match a request for "inventory.qty".
#
# ABAC row filters live in the p2 policy rows (see policy.csv). They are
# read programmatically by sql_gate.py and applied as WHERE-clause
# rewrites — they are never evaluated through enforce().
#
# The trailing `columns` field of p2 is OPTIONAL: a 3-field row is a row
# filter, a 4-field row ("p2, role, table, filter, id|name") is a scoped
# grant (those columns, for those rows, with no p grant needed). pycasbin's
# file adapter keeps every field a line has, whatever this definition says,
# and enforce() never evaluates p2, so the only arity check that matters
# is sql_gate's (3 or 4 fields; anything else fails the policy load).
#
# Deny rules are separate ptypes with the same shapes as their allow
# counterparts: p3 (= p with deny effect: "p3, sub, table.column, read")
# and p4 (= p2 with deny effect: "p4, sub, table, filter[, columns]").
# Subjects may be roles or per-user subjects "user:<username>"; a g row
# "g, user:alice, hr_manager" gives alice an extra role. sql_gate.py
# evaluates p/p3 (keyMatch over the subject sets) and p2/p4 itself with
# user-over-role precedence; the matcher below is kept for Casbin's own
# role-hierarchy bookkeeping (g) and policy loading, not for decisions.
# The gate refuses to load a model that does not define p3 and p4.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act
p2 = sub, table, filter, columns
p3 = sub, obj, act
p4 = sub, table, filter, columns

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && r.act == p.act
