# RBIC + Open WebUI + Keycloak: a LOCAL TEST deployment (see README.md).
#
#   rbic-seed --config-dir examples/demo        # once, on the host (repo root)
#   export ANTHROPIC_API_KEY=...                # your key, from your shell
#   cd integrations/openwebui && docker compose up --build
#
# Then open http://localhost:3000 and sign in with SSO (Keycloak).
#
# Every secret below is a clearly fake DEMO value. Change all of them (and use
# HTTPS) for anything that is not a throwaway local test.
#
# Hostnames: the browser and the Open WebUI container must reach Keycloak
# under the SAME URL, or token issuer checks fail. We use
# http://keycloak.localhost:8080 - browsers resolve *.localhost to 127.0.0.1
# (port 8080 is published below), and inside the compose network the alias
# "keycloak.localhost" resolves to the Keycloak container. If your browser
# doesn't resolve *.localhost, add "127.0.0.1 keycloak.localhost" to your
# hosts file.

name: rbic-openwebui

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: demo-only-keycloak-admin-pw   # DEMO ONLY
      KC_HOSTNAME: http://keycloak.localhost:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-rbic.json:/opt/keycloak/data/import/realm-rbic.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - keycloak.localhost

  open-webui:
    build:
      context: ../..
      dockerfile: integrations/openwebui/Dockerfile
    image: rbic-openwebui:dev
    depends_on:
      - keycloak
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      # The demo policy + seeded company.db, READ-ONLY. rbic-master edits the
      # same host directory; the gate hot-reloads on the next request.
      - ../../examples/demo:/app/rbic/config:ro
      # rbic audit log (set the Pipe Valve AUDIT_LOG_PATH to
      # /app/rbic/audit/audit.jsonl).
      - rbic-audit:/app/rbic/audit
      - open-webui-data:/app/backend/data
    environment:
      # ---- rbic ----------------------------------------------------------
      RBIC_CONFIG_DIR: /app/rbic/config          # Valve CONFIG_DIR empty = this
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell}
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "false"

      # ---- Open WebUI basics ---------------------------------------------
      WEBUI_URL: http://localhost:3000
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-CHANGE-ME-demo-only-not-a-secret}
      # Env stays authoritative: admin-UI changes to persistent settings
      # don't override the hardening below (they don't survive a restart).
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"

      # ---- SSO only (generic OIDC -> Keycloak) ----------------------------
      WEBUI_AUTH: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"    # LOGIN_FORM only hides the form; this closes /api/v1/auths/signin
      ENABLE_SIGNUP: "false"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_ALLOWED_DOMAINS: example.test
      OAUTH_PROVIDER_NAME: Keycloak (demo)
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: demo-only-open-webui-client-secret-change-me   # DEMO ONLY
      OPENID_PROVIDER_URL: http://keycloak.localhost:8080/realms/rbic/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://localhost:3000/oauth/oidc/login/callback
      OAUTH_SCOPES: openid email profile
      # Demo over plain HTTP: authlib's transport check
      # (authlib.common.security.is_secure_transport) only accepts https://
      # and http://localhost|127.0.0.1. NEVER set this in production.
      AUTHLIB_INSECURE_TRANSPORT: "1"
      # New SSO users can chat right away in this demo. Production: keep the
      # default "pending" (an admin approves) or use OAuth role management.
      DEFAULT_USER_ROLE: user

      # ---- no other models or connections ---------------------------------
      ENABLE_OPENAI_API: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      BYPASS_MODEL_ACCESS_CONTROL: "false"
      ENABLE_API_KEYS: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"

      # ---- nothing re-sends transcripts to another model -------------------
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_IMAGE_PROMPT_GENERATION: "false"
      ENABLE_CONTEXT_COMPACTION: "false"
      ENABLE_MEMORIES: "false"
      ENABLE_MEMORY_BACKGROUND_REVIEW: "false"

      # ---- no sharing, no shared audiences ---------------------------------
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_CHANNELS: "false"
      ENABLE_NOTES: "false"
      ENABLE_AUTOMATIONS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      USER_PERMISSIONS_CHAT_SHARE: "false"
      USER_PERMISSIONS_CHAT_ALLOW_PUBLIC_SHARING: "false"
      USER_PERMISSIONS_CHAT_ALLOW_OPEN_SHARING: "false"
      USER_PERMISSIONS_FOLDERS_ALLOW_SHARING: "false"

      # ---- worker chat features this model doesn't use ---------------------
      USER_PERMISSIONS_CHAT_TEMPORARY: "false"        # the Pipe refuses temporary chats
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_VALVES: "false"
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_MEMORIES: "false"
      USER_PERMISSIONS_FEATURES_NOTES: "false"
      USER_PERMISSIONS_FEATURES_CHANNELS: "false"
      USER_PERMISSIONS_FEATURES_AUTOMATIONS: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_CODE_EXECUTION: "false"

volumes:
  rbic-audit:
  open-webui-data:
