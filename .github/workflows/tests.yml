name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Required checks: "pytest (3.10)", "pytest (3.11)", "pytest (3.12)".
  # Keep the job id and the matrix, or update the branch ruleset too.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Gate demo smoke test
        run: rbic-gate-demo --config-dir examples/demo
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import rbic, sys; print(rbic.__version__)"
          "$RUNNER_TEMP/wheel-venv/bin/rbic-gate-demo" --config-dir "$GITHUB_WORKSPACE/examples/demo"

  # Not a required check. Proves the declared lower bound anthropic>=0.86
  # works with the engine, and runs the Open WebUI Pipe tests against the
  # versions Open WebUI v0.12.4 pins (anthropic==0.86.0, pydantic==2.13.4).
  # (The pytest job above runs the Pipe tests too, with the latest deps.)
  adapters:
    name: adapters (anthropic 0.86.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install anthropic 0.86.0 / pydantic 2.13.4, then the package
        run: |
          pip install "anthropic==0.86.0" "pydantic==2.13.4"
          pip install -e ".[test]" "anthropic==0.86.0" "pydantic==2.13.4"
          python -c "import anthropic; assert anthropic.__version__ == '0.86.0', anthropic.__version__; print('anthropic', anthropic.__version__)"
          python -c "import pydantic; assert pydantic.VERSION == '2.13.4', pydantic.VERSION; print('pydantic', pydantic.VERSION)"
      - name: Engine, identity, history and Open WebUI Pipe tests
        run: python -m pytest -q tests/test_engine.py tests/test_identity.py tests/test_history.py tests/test_cli.py tests/test_openwebui_pipe.py
