name: release

# Push a tag vX.Y.Z (matching rbic.__version__) to build, test and publish:
# TestPyPI first, then PyPI after the `pypi` environment is approved.
# PyPI Trusted Publishing (OIDC) only: no API tokens or secrets.
# Owner setup and the release checklist: docs/RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[test]"
      - name: Tag must equal v + rbic.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import rbic; print(rbic.__version__)')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match rbic.__version__ $VERSION (expected v$VERSION)"
            exit 1
          fi
      - name: Run tests
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rbic-plugin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rbic-plugin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
