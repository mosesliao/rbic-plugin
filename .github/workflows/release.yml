name: release

# Push a tag vX.Y.Z (matching rbic.__version__) to build, test and publish:
# TestPyPI first, then PyPI after the `pypi` environment is approved.
# PyPI Trusted Publishing (OIDC) only: no API tokens or secrets.
# Owner setup and the release checklist: docs/RELEASING.md.
#
# Supply-chain hardening: every third-party action is pinned to a full
# commit SHA (the tag it came from is in the trailing comment; bump both
# together), the release job uses no dependency cache, the tools that
# produce the published files are pinned (BUILD_REQUIREMENTS), and only a
# commit already on origin/main can be released.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Exact versions of the tooling that builds the sdist and wheel.
  BUILD_REQUIREMENTS: "build==1.4.0 hatchling==1.30.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history for the ancestor check below
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not on origin/main; tag a commit on main"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[test]"
      - name: Tag must equal v + rbic.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import rbic; print(rbic.__version__)')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match rbic.__version__ $VERSION (expected v$VERSION)"
            exit 1
          fi
      - name: Run tests
        run: python -m pytest -q
      - name: Build sdist and wheel (pinned build tooling)
        run: |
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --quiet $BUILD_REQUIREMENTS
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rbic-plugin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rbic-plugin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
